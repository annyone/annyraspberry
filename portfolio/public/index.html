      Google Fonts: Raleway.

      его рисовать, а синтезирует — механически утолщит 400, и начертание
      поплывёт. Проверка: найти в src класс font-medium или font-semibold —
      каждому найденному весу должно быть соответствие в wght@.
      preconnect на fonts.gstatic.com нужен отдельно от fonts.googleapis.com:
      по первому адресу приходит CSS, по второму — сами файлы шрифта, и без
      преднастроенного соединения их загрузка начинается только после
      разбора CSS.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
